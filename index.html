<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111116"><title>NOVA Pay 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111116;color:#f8f8fc;font-family:system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;padding:26px 20px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800}.logo b{color:#ad8cff}.tag{font-size:12px;color:#bbb}.card{background:#23232d;border-radius:22px;padding:26px;margin:25px 0}.muted{color:#b6b6c4;font-size:13px}.balance{font-size:35px;font-weight:800;margin:12px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{background:#8b5cf6;color:white;border:0;border-radius:13px;padding:15px 10px;font-weight:700;cursor:pointer}.actions button{background:#2c2c37}h2{font-size:19px;margin-top:30px}.entry{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #33333e}.notice{background:#30283f;border-radius:12px;padding:12px;color:#e1d7ff;font-size:13px;margin-top:20px}dialog{background:#23232d;color:white;border:1px solid #50505d;border-radius:20px;width:min(92%,420px);padding:24px}dialog::backdrop{background:#000b}input{display:block;width:100%;margin:10px 0 18px;padding:14px;border:1px solid #555563;border-radius:12px;background:#17171e;color:white}.full{width:100%;margin-top:12px}</style></head>
<body><main class="app"><header><div class="logo"><b>◆</b> NOVA Pay</div><span class="tag">2.0</span></header><div class="notice">Demonstração: nenhum pagamento Pix real será enviado.</div><section class="card"><div class="muted">Saldo demonstrativo</div><div class="balance" id="balance">R$ 2.450,80</div><div class="muted">Conta fictícia • BRL</div></section><div class="actions"><button id="pay">↗ Pagar Pix</button><button id="receive">↙ Receber</button><button id="statement">☷ Extrato</button></div><h2>Movimentações</h2><div id="entries"></div></main><dialog id="modal"><h2 id="title"></h2><div id="body"></div><button class="full" id="close">Fechar</button></dialog>
<script>
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);let tx=[];try{const a=JSON.parse(localStorage.getItem('nova_pay_demo_tx')||'[]');if(Array.isArray(a))tx=a.filter(x=>Number.isFinite(x.amount)&&x.amount>0&&x.type==='out')}catch{}let cents=245080-tx.reduce((s,t)=>s+Math.round(t.amount*100),0);function render(){$('balance').textContent=fmt(cents/100);$('entries').replaceChildren();if(!tx.length){const p=document.createElement('p');p.className='muted';p.textContent='Nenhuma transação ainda.';$('entries').append(p)}for(const t of [...tx].reverse()){const row=document.createElement('div');row.className='entry';const left=document.createElement('span');left.textContent='Pix fictício enviado';const right=document.createElement('strong');right.textContent='− '+fmt(t.amount);row.append(left,right);$('entries').append(row)}}function show(title){$('title').textContent=title;$('body').replaceChildren();$('modal').showModal()}function field(label,type,placeholder){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.type=type;input.placeholder=placeholder;$('body').append(l,input);return input}function action(text,fn){const b=document.createElement('button');b.className='full';b.textContent=text;b.onclick=fn;$('body').append(b)}$('pay').onclick=()=>{show('Pagar Pix — simulação');const key=field('Chave Pix','text','CPF, e-mail ou chave aleatória');const amount=field('Valor em reais','number','0,00');amount.min='0.01';amount.step='0.01';action('Revisar',()=>{const value=Number(amount.value),v=Math.round(value*100);if(!key.value.trim()||!Number.isFinite(value)||v<=0||v>cents){alert('Verifique a chave e o valor.');return}const destination=key.value.trim();show('Confirmar pagamento fictício');const p=document.createElement('p');p.textContent='Destino: '+destination+' | Valor: '+fmt(v/100);$('body').append(p);action('Confirmar simulação',()=>{cents-=v;tx.push({type:'out',amount:v/100,date:new Date().toISOString()});localStorage.setItem('nova_pay_demo_tx',JSON.stringify(tx));render();show('Comprovante demonstrativo');const receipt=document.createElement('p');receipt.textContent='Pix simulado de '+fmt(v/100)+' registrado. Nenhum dinheiro foi transferido.';$('body').append(receipt)})})};$('receive').onclick=()=>{show('Receber Pix');const p=document.createElement('p');p.textContent='Cobranças e QR Codes reais estarão disponíveis somente após integração e homologação com um provedor Pix.';$('body').append(p)};$('statement').onclick=()=>{show('Extrato fictício');const p=document.createElement('p');p.textContent=tx.length?tx.length+' pagamento(s) simulado(s) registrados neste navegador.':'Nenhuma movimentação.';$('body').append(p)};$('close').onclick=()=>$('modal').close();render();
</script></body></html>
